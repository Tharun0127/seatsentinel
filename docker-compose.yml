name: seatsentinel

services:
  db:
    image: postgres:16-alpine
    container_name: seatsentinel-db
    environment:
      POSTGRES_USER: seats
      POSTGRES_PASSWORD: seats
      POSTGRES_DB: seatsentinel
    # Concurrency tests open up to ~200 connections at once.
    command: postgres -c max_connections=400
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U seats -d seatsentinel"]
      interval: 3s
      timeout: 3s
      retries: 30

  redis:
    image: redis:7-alpine
    container_name: seatsentinel-redis
    # Holds and locks are short-lived; no persistence needed.
    command: redis-server --save "" --appendonly no
    ports:
      - "6372:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 3s
      retries: 30

  api:
    build: ./backend
    container_name: seatsentinel-api
    environment:
      DATABASE_URL: postgresql+asyncpg://seats:seats@db:5432/seatsentinel
      TEST_DATABASE_URL: postgresql+asyncpg://seats:seats@db:5432/seatsentinel_test
      REDIS_URL: redis://redis:6379/0
      TEST_REDIS_URL: redis://redis:6379/15
      JWT_SECRET: ${JWT_SECRET:-change-me-in-production}
      HOLD_TTL_SECONDS: ${HOLD_TTL_SECONDS:-300}
      WEB_WORKERS: ${WEB_WORKERS:-4}
    ports:
      - "8002:8000"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=3)"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 60s

volumes:
  pgdata:
