server {
    listen 80;
    root /usr/share/nginx/html;

    # Same-origin API: the browser calls /api/..., nginx forwards to FastAPI.
    location /api/ {
        proxy_pass http://api:8000/;
        proxy_set_header Host $host;
    }

    # Single-page app: unknown paths (e.g. /products/42) serve index.html.
    location / {
        try_files $uri /index.html;
    }
}
